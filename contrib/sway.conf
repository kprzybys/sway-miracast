# sway-miracast: Sway snippet. Copy into ~/.config/sway/config (or `include` this file).
# Needs ~/.local/bin (or wherever you installed) on PATH of the Sway session; otherwise use absolute paths.

# Pick a TV from a list (scan + known TVs, disconnect, duplicate/extend). A second press closes the menu.
bindsym $mod+Shift+t exec miracast-menu

# What the TV shows: a copy of the laptop screen (duplicate) or a separate screen to the right (extend).
bindsym $mod+Ctrl+t exec miracast-screen toggle

# Film mode: delay the picture to match the TV's audio delay (measures with the microphone) / desk mode.
# Experimental; mostly unnecessary since the Samsung low-latency mode.
bindsym $mod+Ctrl+f exec miracast-film toggle

# Move the focused window to the TV when it is an extended screen (the virtual output is to the right).
# bindsym $mod+Ctrl+p move container to output right

# When Sway starts (also after a crash) give the service a fresh WAYLAND_DISPLAY / SWAYSOCK.
# Without this the service keeps the dead socket of the previous Sway.
exec systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK && systemctl --user restart sway-miracast-source.service
