[package]
name = "wfd-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Miracast (WFD R1) source daemon: Wi-Fi Direct via NetworkManager, RTSP session, media supervision"

[dependencies]
wfd-proto = { path = "../wfd-proto" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
wfd-util = { path = "../wfd-util" }

[lints]
workspace = true
